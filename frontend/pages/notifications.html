<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .notif-card { transition: all 0.2s; border-left: 4px solid transparent; }
        .notif-unread { border-left-color: var(--primary); background: rgba(99, 102, 241, 0.06); }
        body.light-mode .notif-unread { background: rgba(99, 102, 241, 0.04); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap me-2" style="color:var(--primary)"></i>Project Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id="nav-auth"></ul>
            </div>
        </div>
    </nav>

    <div class="container p-4 fade-in">
        <div class="row">
            <div class="col-md-3 d-none d-md-block" id="notif-sidebar"></div>
            <div class="col-md-9" id="notif-main" style="width:100%;">
                <div class="page-header d-flex justify-content-between align-items-center">
                    <h2><i class="fas fa-bell me-3" style="color:var(--primary)"></i>Notifications <span id="page-notif-badge" class="badge bg-danger fs-6 align-middle ms-2" style="display:none">0</span></h2>
                    <button class="btn btn-outline-secondary btn-sm" onclick="fetchPageNotifications()"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
                </div>
                <div id="page-notif-body">
                    <div class="text-center mt-5"><div class="spinner-border"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        async function initPage() {
            const user = await checkAuth();
            if (!user) return;
            
            const sidebar = document.getElementById('notif-sidebar');
            const main = document.getElementById('notif-main');
            
            if (user.role === 'student' || user.role === 'guide') {
                main.style.width = '';
                main.className = 'col-md-9';
                sidebar.className = 'col-md-3';
                
                let links = '';
                if (user.role === 'student') {
                    links += '<a href="student-dashboard.html" class="list-group-item"><i class="fas fa-tachometer-alt me-2"></i>My Dashboard</a>';
                    links += '<a href="submit-project.html" class="list-group-item"><i class="fas fa-upload me-2"></i>Submit Project</a>';
                } else if (user.role === 'guide') {
                    links += '<a href="guide-dashboard.html" class="list-group-item"><i class="fas fa-tachometer-alt me-2"></i>My Dashboard</a>';
                }
                
                links += '<a href="notifications.html" class="list-group-item active"><i class="fas fa-bell me-2"></i>Notifications</a>';
                links += '<a href="profile.html" class="list-group-item"><i class="fas fa-user me-2"></i>My Profile</a>';
                links += '<a href="#" class="list-group-item text-danger" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>';
                
                sidebar.innerHTML = '<div class="list-group">' + links + '</div>';
            } else if (user.role === 'hod' || user.role === 'admin') {
                sidebar.style.display = 'none';
                main.style.width = '100%';
                const backUrl = user.role === 'hod' ? 'hod-dashboard.html' : 'admin-dashboard.html';
                const header = document.querySelector('.page-header h2');
                header.innerHTML = `<a href="${backUrl}" class="btn btn-sm btn-outline-primary me-3"><i class="fas fa-arrow-left"></i></a>` + header.innerHTML;
            }
            
            fetchPageNotifications();
        }
        
        async function fetchPageNotifications() {
            const ob = document.getElementById('page-notif-body');
            const badge = document.getElementById('page-notif-badge');
            ob.innerHTML = '<div class="text-center mt-5"><div class="spinner-border"></div></div>';
            try {
                const req = await fetch(`${API_URL}?action=getNotifications`, { credentials: 'include' });
                const res = await req.json();
                if (res.success) {
                    const unreadCount = res.notifications.filter(n => !n.is_read).length;
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount + " New";
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                    
                    if (res.notifications.length === 0) {
                        ob.innerHTML = '<div class="empty-state mt-4"><i class="fas fa-bell-slash empty-icon"></i><p>No notifications yet.</p></div>';
                    } else {
                        ob.innerHTML = res.notifications.map(n => `
                            <div class="card mb-3 notif-card ${n.is_read ? '' : 'notif-unread'}">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title m-0" style="color:var(--primary)">${escapeHtml(n.title)}</h5>
                                        <small class="text-muted"><i class="far fa-clock me-1"></i>${new Date(n.created_at).toLocaleString()}</small>
                                    </div>
                                    <p class="card-text fs-6">${escapeHtml(n.message)}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <small class="text-muted">From: ${n.sender_name ? escapeHtml(n.sender_name) : 'System'}</small>
                                        ${!n.is_read ? `<button class="btn btn-sm btn-primary py-1 px-3" onclick="markPageRead(${n.id})"><i class="fas fa-check me-1"></i>Mark as Read</button>` : '<span class="badge bg-secondary"><i class="fas fa-check-double me-1"></i>Read</span>'}
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch(e) { ob.innerHTML = '<div class="alert alert-danger">Failed to load notifications.</div>'; }
        }

        async function markPageRead(id) {
            const fd = new FormData();
            fd.append('notification_id', id);
            await fetch(`${API_URL}?action=markNotificationRead`, { method: 'POST', body: fd, credentials: 'include' });
            fetchPageNotifications();
            pollNotifications(); 
        }

        initPage();
    </script>
</body>
</html>
