<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap me-2" style="color:var(--primary)"></i>Project Portal</a>
            <ul class="navbar-nav ms-auto" id="nav-auth">
                <li class="nav-item"><a class="nav-link" href="login.html"><i class="fas fa-sign-in-alt me-1"></i>Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="container fade-in" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="auth-card w-100">
            <div class="card">
                <div class="card-body">
                    <div class="auth-logo">
                        <div class="logo-dot" style="background:linear-gradient(135deg,var(--warning),#fbbf24);">
                            <i class="fas fa-key"></i>
                        </div>
                        <h3>Reset Password</h3>
                        <p>Enter your email and a new password</p>
                    </div>
                    <div id="msg" class="alert d-none"></div>
                    <form id="reset-form">
                        <div class="mb-4">
                            <label>Registered Email</label>
                            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label>New Password</label>
                            <div class="input-pw-wrap">
                                <input type="password" id="new_password" class="form-control" placeholder="••••••••" required>
                                <button type="button" class="pw-toggle" id="pw-toggle-fp"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <button class="btn btn-warning w-100 mb-3" type="submit">
                            <i class="fas fa-lock me-2"></i>Reset Password
                        </button>
                        <div class="text-center">
                            <a href="login.html" style="font-size:0.9rem;"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        initPwToggle('new_password', 'pw-toggle-fp');

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('email', document.getElementById('email').value);
            formData.append('new_password', document.getElementById('new_password').value);

            const req = await fetch(`${API_URL}?action=resetPassword`, { method: 'POST', body: formData, credentials: 'include' });
            const res = await req.json();

            const el = document.getElementById('msg');
            el.classList.remove('d-none', 'alert-success', 'alert-danger');

            if (res.success) {
                el.innerHTML = `<i class="fas fa-check-circle me-2"></i>${res.message}`;
                el.classList.add('alert-success');
                showToast(res.message, 'success', 'Password Reset');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                el.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>${res.message}`;
                el.classList.add('alert-danger');
                showToast(res.message, 'error');
                btn.innerHTML = '<i class="fas fa-lock me-2"></i>Reset Password';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
