<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap me-2" style="color:var(--primary)"></i>Project Portal</a>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto" id="nav-auth"></ul>
            </div>
        </div>
    </nav>
    <div class="container p-4 fade-in">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group" id="sidebar">
                    <a href="student-dashboard.html" class="list-group-item active"><i class="fas fa-tachometer-alt me-2"></i>My Dashboard</a>
                    <!-- Dynamic links will be injected here -->
                </div>
            </div>
            <div class="col-md-9">
                <h2><i class="fas fa-user-graduate me-3" style="color:var(--primary)"></i>Student Dashboard</h2>
                <div id="content-container" class="loading-text">Loading dashboard data...</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

    <!-- Edit Request Modal -->
    <div class="modal fade" id="editRequestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-hand-paper me-2" style="color:var(--warning)"></i>Request Edit / Resubmit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p style="color:var(--text-muted);font-size:0.9rem;">Please describe why you need to edit or resubmit your project. This will be reviewed by the HOD.</p>
                    <input type="hidden" id="edit-req-project-id">
                    <div class="mb-3">
                        <label class="form-label">Reason</label>
                        <textarea id="edit-req-reason" class="form-control" rows="3" placeholder="e.g. Need to update the GitHub link and fix the abstract..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" onclick="submitEditRequest()"><i class="fas fa-paper-plane me-2"></i>Send Request</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        checkAuth('student');

        async function loadDashboard() {
            const sidebar = document.getElementById('sidebar');
            const container = document.getElementById('content-container');

            const reqTeam = await fetch(`${API_URL}?action=getStudentTeam`, { credentials: 'include' });
            const resTeam = await reqTeam.json();

            let sidebarLinks = '<a href="student-dashboard.html" class="list-group-item active"><i class="fas fa-tachometer-alt me-2"></i>My Dashboard</a>';

            if (resTeam.success && resTeam.team) {
                const reqProj = await fetch(`${API_URL}?action=getStudentProject`, { credentials: 'include' });
                const resProj = await reqProj.json();

                if (!resProj.success || !resProj.project || resProj.project.status === 'resubmit' || resProj.project.status === 'rejected') {
                    if (resTeam.team.guide_id) {
                        sidebarLinks += '<a href="submit-project.html" class="list-group-item"><i class="fas fa-upload me-2"></i>Submit Project</a>';
                    } else {
                        sidebarLinks += '<button class="list-group-item text-muted w-100 text-start" disabled style="cursor:not-allowed;background:transparent;"><i class="fas fa-lock me-2"></i>Submit Project</button>';
                    }
                }

                let html = `
                    <div class="card mb-3">
                        <div class="card-header-accent">
                            <div class="header-icon"><i class="fas fa-users"></i></div>
                            <h5>Team: ${resTeam.team.name}</h5>
                        </div>
                        <div class="card-body">
                            <ul>${resTeam.members.map(m => `<li>${m.username} (${m.roll_number}) ${m.is_leader ? '<span class="badge bg-warning">Leader</span>' : ''}</li>`).join('')}</ul>
                        </div>
                    </div>
                `;

                if (!resTeam.team.guide_id) {
                    html += `
                        <div class="alert alert-warning mt-4 border-warning">
                            <h5 class="alert-heading text-warning"><i class="fas fa-clock me-2"></i>Waiting for Guide Assignment</h5>
                            <p class="mb-0 text-white">Your team is currently waiting for the HOD to assign a Project Guide. You will be able to submit your project details and files once a guide is assigned to your team.</p>
                        </div>
                    `;
                } else if (resProj.success && resProj.project) {
                    const p = resProj.project;
                    html += `
                        <div class="card mt-4">
                            <div class="card-header-accent">
                                <div class="header-icon" style="background:rgba(16,185,129,0.15);color:var(--success)"><i class="fas fa-project-diagram"></i></div>
                                <div>
                                    <h5 style="margin:0">${p.title}</h5>
                                    <span class="badge bg-${p.status === 'approved' ? 'success' : p.status === 'rejected' ? 'danger' : 'warning'}" style="font-size:0.7rem">${p.status}</span>
                                    ${p.edit_request ? '<span class="badge bg-info ms-2" style="font-size:0.7rem"><i class="fas fa-clock me-1"></i>Edit Requested</span>' : ''}
                                    ${p.edit_reason ? `<div class="mt-2 text-muted fw-light fst-italic" style="font-size: 0.8rem;">Reason: ${escapeHtml(p.edit_reason)}</div>` : ''}
                                </div>
                            </div>
                            <div class="card-body">
                                <p><strong>Semester:</strong> <span class="badge bg-primary">${p.semester || 'N/A'}</span></p>
                                <p><strong>Abstract:</strong> ${p.abstract}</p>
                                <p><strong>Tech Stack:</strong> ${p.tech_stack}</p>
                                ${p.screenshot_path ? `
                                    <div class="mb-3">
                                        <strong>Project Screenshot:</strong><br>
                                        <img src="${SCREENSHOTS_BASE_URL}/${p.screenshot_path}" 
                                             class="mt-2 rounded border" 
                                             style="max-width:200px; cursor:pointer; transition:transform 0.2s;" 
                                             onclick="viewFullScreenshot('${SCREENSHOTS_BASE_URL}/${p.screenshot_path}')"
                                             onmouseover="this.style.transform='scale(1.05)'"
                                             onmouseout="this.style.transform='scale(1)'"
                                             alt="Project Screenshot">
                                    </div>
                                ` : ''}
                                ${p.website_link ? `<p><strong>Website Link:</strong> <a href="${escapeHtml(p.website_link)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-external-link-alt me-1"></i>${escapeHtml(p.website_link)}</a></p>` : ''}
                                ${p.marks ? `
                                <hr>
                                <h4>Evaluation</h4>
                                <p><strong>Marks:</strong> ${p.marks}</p>
                                <p><strong>Feedback:</strong> ${p.feedback}</p>
                                ` : ''}
                                ${(p.status === 'approved' && !p.edit_request) ? `
                                <div class="mt-3">
                                    <button class="btn btn-outline-primary btn-sm" onclick="requestEdit(${p.id})"><i class="fas fa-hand-paper me-2"></i>Request Edit/Resubmit from HOD</button>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    
                    if (p.status === 'resubmit' || p.status === 'rejected') {
                        html += `
                        <div class="alert alert-warning mb-4" role="alert">
                            <h5 class="alert-heading">Resubmission Required</h5>
                            <p>Your team has been granted the option to resubmit your project details (current status: <strong>${p.status}</strong>). Please check any feedback above and <a href="submit-project.html" class="alert-link">resubmit your project deliverables</a>.</p>
                        </div>
                    `;
                    }
                } else {
                    html += `<div class="empty-state">
                        <i class="fas fa-folder-open empty-icon"></i>
                        <p>No project submitted yet.</p>
                        <small style="opacity:0.5">Submit your project once a guide is assigned.</small>
                    </div>`;
                }

                container.innerHTML = html;
            } else {
                sidebarLinks += '<a href="create-team.html" class="list-group-item"><i class="fas fa-users me-2"></i>Create/Join Team</a>';
                container.innerHTML = '<div class="alert alert-info"><i class="fas fa-info-circle me-2"></i>You are not part of any team. Please create or join a team first.</div>';
            }

            sidebarLinks += '<a href="notifications.html" class="list-group-item d-flex align-items-center"><i class="fas fa-bell me-2"></i>Notifications<span class="sidebar-notif-badge badge bg-danger rounded-pill ms-auto" style="display:none;">0</span></a>';
            sidebarLinks += '<a href="profile.html" class="list-group-item"><i class="fas fa-user me-2"></i>My Profile</a>';
            sidebarLinks += '<a href="#" class="list-group-item text-danger" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>';
            sidebar.innerHTML = sidebarLinks;
        }

        async function requestEdit(projectId) {
            document.getElementById('edit-req-project-id').value = projectId;
            document.getElementById('edit-req-reason').value = '';
            new bootstrap.Modal(document.getElementById('editRequestModal')).show();
        }

        async function submitEditRequest() {
            const projectId = document.getElementById('edit-req-project-id').value;
            const reason = document.getElementById('edit-req-reason').value.trim();
            if (!reason) {
                showToast('Please enter a reason before submitting.', 'error');
                return;
            }
            const fd = new FormData();
            fd.append('project_id', projectId);
            fd.append('reason', reason);
            const req = await fetch(`${API_URL}?action=requestEditOption`, { method: 'POST', body: fd, credentials: 'include' });
            const res = await req.json();
            if (res.success) {
                showToast('Request sent to HOD', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editRequestModal')).hide();
                loadDashboard();
            } else {
                showToast(res.message, 'error');
            }
        }

        loadDashboard();

        function viewFullScreenshot(src) {
            document.getElementById('fullScreenshotImg').src = src;
            new bootstrap.Modal(document.getElementById('screenshotModal')).show();
        }
    </script>
</body>

<!-- Screenshot Modal -->
<div class="modal fade" id="screenshotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background:transparent; border:none;">
            <div class="modal-body p-0 position-relative">
                <button type="button" class="btn-close btn-close-white position-absolute" style="top:-30px; right:0;" data-bs-dismiss="modal" aria-label="Close"></button>
                <img id="fullScreenshotImg" src="" alt="Full Screenshot" style="width:100%; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
            </div>
        </div>
    </div>
</div>

</html>
