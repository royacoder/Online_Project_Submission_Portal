<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create HOD Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Online Project Submission Portal</a>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto" id="nav-auth"></ul>
            </div>
        </div>
    </nav>
    <div class="container p-4 fade-in">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a href="admin-dashboard.html" class="list-group-item">Dashboard</a>
                    <a href="create-hod.html" class="list-group-item active">Create HOD</a>
                    <a href="#" class="list-group-item text-danger" onclick="logout()">Logout</a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Create HOD Account</h4>
                    </div>
                    <div class="card-body">
                        <form id="hod-form">
                            <div class="mb-3">
                                <label>Name</label>
                                <input type="text" id="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Department</label>
                                <select id="department" class="form-select" required></select>
                            </div>
                            <button type="submit" class="btn btn-primary float-end">Create Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/script.js"></script>
    <script>
        checkAuth('admin');

        async function loadDepts() {
            try {
                const req = await fetch(`${API_URL}?action=getDepartments`);
                const res = await req.json();
                const sel = document.getElementById('department');
                sel.innerHTML = '<option value="" disabled selected>-- Select Department --</option>';
                if (res.success && res.data.length > 0) {
                    res.data.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        opt.textContent = d.name;
                        sel.appendChild(opt);
                    });
                } else {
                    sel.innerHTML += '<option value="" disabled>No departments configured in Database</option>';
                }
            } catch (err) {
                console.error('Failed to parse loadDepts:', err);
                const sel = document.getElementById('department');
                sel.innerHTML = '<option value="" disabled>Error connecting to Database API</option>';
            }
        }
        loadDepts();

        document.getElementById('hod-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('name', document.getElementById('name').value);
            fd.append('email', document.getElementById('email').value);
            fd.append('password', document.getElementById('password').value);
            fd.append('department_id', document.getElementById('department').value);

            const req = await fetch(`${API_URL}?action=createHod`, { method: 'POST', body: fd, credentials: 'include' });
            const res = await req.json();

            if (res.success) {
                alert('HOD created successfully!');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert(res.message);
            }
        });
    </script>
</body>

</html>
